name: Setup — K8s Secrets via Portainer API

# Crée ou met à jour les secrets K8s dans le namespace de l'app
# via l'API Portainer (pas besoin de kubeconfig dans GitHub).
#
# Variables GitHub requis :
#   PORTAINER_URL          ex: https://portainer.sty.ovh
#   PORTAINER_ENDPOINT_ID  ex: 1
#   HARBOR_REGISTRY        ex: registry.sty.ovh
#   HARBOR_USERNAME        ex: robot$gh-monapp
#
# Secrets GitHub requis :
#   PORTAINER_TOKEN        clé API Portainer (Settings → API Key dans Portainer)
#   HARBOR_PASSWORD        mot de passe robot Harbor
#   APP_MONGODB_ROOT_USERNAME
#   APP_MONGODB_ROOT_PASSWORD
#   APP_MONGODB_URI
#   APP_JWT_SECRET
#   APP_MINIO_ACCESS_KEY
#   APP_MINIO_SECRET_KEY

on:
  workflow_dispatch:

jobs:
  app-secrets:
    name: Create/update APP_NAME-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic réseau runner
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
        run: |
          set +e
          echo "=== IP publique du runner ==="
          curl -s --max-time 5 https://api.ipify.org; echo
          echo "=== Résolution DNS ==="
          nslookup $(echo "$PORTAINER_URL" | sed 's|https\?://||') 2>/dev/null || true
          echo "=== TCP connect port 443 ==="
          HOST=$(echo "$PORTAINER_URL" | sed 's|https\?://||')
          nc -zv -w 5 "$HOST" 443 2>&1 || true

      - name: Push APP_NAME-secrets (Opaque)
        env:
          PORTAINER_URL:         ${{ vars.PORTAINER_URL }}
          ENDPOINT_ID:           ${{ vars.PORTAINER_ENDPOINT_ID }}
          TOKEN:                 ${{ secrets.PORTAINER_TOKEN }}
          MONGODB_ROOT_USERNAME: ${{ secrets.APP_MONGODB_ROOT_USERNAME }}
          MONGODB_ROOT_PASSWORD: ${{ secrets.APP_MONGODB_ROOT_PASSWORD }}
          MONGODB_URI:           ${{ secrets.APP_MONGODB_URI }}
          JWT_SECRET:            ${{ secrets.APP_JWT_SECRET }}
          MINIO_ACCESS_KEY:      ${{ secrets.APP_MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY:      ${{ secrets.APP_MINIO_SECRET_KEY }}
        run: |
          set +e

          # ── Validation des variables ───────────────────────────────────────
          if [ -z "$PORTAINER_URL" ]; then
            echo "❌ PORTAINER_URL est vide — vérifier vars.PORTAINER_URL"
            exit 1
          fi
          if [ -z "$ENDPOINT_ID" ]; then
            echo "❌ ENDPOINT_ID est vide — vérifier vars.PORTAINER_ENDPOINT_ID"
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "❌ TOKEN est vide — vérifier secrets.PORTAINER_TOKEN"
            exit 1
          fi

          # ── Test de connectivité Portainer ─────────────────────────────────
          echo "ℹ️  Test de connectivité Portainer..."
          PING=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 \
            "$PORTAINER_URL/api/status" \
            -H "X-API-Key: $TOKEN")
          echo "Portainer /api/status: $PING"

          BASE="$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/kubernetes/api/v1/namespaces/APP_NAME/secrets"
          echo "ℹ️  BASE URL: $BASE"

          # ── Build payload ──────────────────────────────────────────────────
          PAYLOAD=$(jq -cn \
            --arg u   "$MONGODB_ROOT_USERNAME" \
            --arg p   "$MONGODB_ROOT_PASSWORD" \
            --arg uri "$MONGODB_URI"           \
            --arg jwt "$JWT_SECRET"            \
            --arg mak "$MINIO_ACCESS_KEY"      \
            --arg msk "$MINIO_SECRET_KEY"      \
            '{
              "apiVersion": "v1",
              "kind": "Secret",
              "metadata": { "name": "APP_NAME-secrets", "namespace": "APP_NAME" },
              "type": "Opaque",
              "stringData": {
                "mongodb_root_username": $u,
                "mongodb_root_password": $p,
                "mongodb_uri":           $uri,
                "jwt_secret":            $jwt,
                "minio_access_key":      $mak,
                "minio_secret_key":      $msk
              }
            }')

          if [ -z "$PAYLOAD" ]; then
            echo "❌ jq failed to build payload"
            exit 1
          fi

          # ── PUT (update) → POST (create) ───────────────────────────────────
          touch /tmp/resp.json
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PUT "$BASE/APP_NAME-secrets" \
            -H "X-API-Key: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "PUT status: $STATUS"

          if [ "$STATUS" = "404" ] || [ "$STATUS" = "422" ] || [ "$STATUS" = "405" ]; then
            echo "→ Création du secret..."
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "$BASE" \
              -H "X-API-Key: $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "POST status: $STATUS"
          fi

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "❌ Erreur HTTP $STATUS :"
            cat /tmp/resp.json
            exit 1
          fi

          echo "✅ APP_NAME-secrets configuré"

  harbor-credentials:
    name: Create/update harbor-credentials
    runs-on: ubuntu-latest
    steps:
      - name: Push harbor-credentials (docker-registry)
        env:
          PORTAINER_URL:   ${{ vars.PORTAINER_URL }}
          ENDPOINT_ID:     ${{ vars.PORTAINER_ENDPOINT_ID }}
          TOKEN:           ${{ secrets.PORTAINER_TOKEN }}
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USER:     ${{ vars.HARBOR_USERNAME }}
          HARBOR_PASS:     ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set +e

          if [ -z "$PORTAINER_URL" ] || [ -z "$ENDPOINT_ID" ] || [ -z "$TOKEN" ]; then
            echo "❌ Variables manquantes — vérifier PORTAINER_URL, PORTAINER_ENDPOINT_ID, PORTAINER_TOKEN"
            exit 1
          fi

          BASE="$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/kubernetes/api/v1/namespaces/APP_NAME/secrets"

          AUTH_B64=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w 0)
          DOCKER_CFG=$(jq -cn \
            --arg reg  "$HARBOR_REGISTRY" \
            --arg user "$HARBOR_USER"     \
            --arg pass "$HARBOR_PASS"     \
            --arg auth "$AUTH_B64"        \
            '{"auths":{($reg):{"username":$user,"password":$pass,"auth":$auth}}}')

          if [ -z "$DOCKER_CFG" ]; then
            echo "❌ jq failed to build docker config"
            exit 1
          fi

          CFG_B64=$(printf '%s' "$DOCKER_CFG" | base64 -w 0)

          PAYLOAD=$(jq -cn \
            --arg cfg "$CFG_B64" \
            '{
              "apiVersion": "v1",
              "kind": "Secret",
              "metadata": { "name": "harbor-credentials", "namespace": "APP_NAME" },
              "type": "kubernetes.io/dockerconfigjson",
              "data": { ".dockerconfigjson": $cfg }
            }')

          touch /tmp/resp.json
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PUT "$BASE/harbor-credentials" \
            -H "X-API-Key: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "PUT status: $STATUS"

          if [ "$STATUS" = "404" ] || [ "$STATUS" = "422" ] || [ "$STATUS" = "405" ]; then
            echo "→ Création du secret..."
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "$BASE" \
              -H "X-API-Key: $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "POST status: $STATUS"
          fi

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "❌ Erreur HTTP $STATUS :"
            cat /tmp/resp.json
            exit 1
          fi

          echo "✅ harbor-credentials configuré"
