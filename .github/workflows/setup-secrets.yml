name: Setup — K8s Secrets via Portainer API

# Crée ou met à jour les secrets K8s dans le namespace de l'app
# via l'API Portainer (pas besoin de kubeconfig dans GitHub).
#
# Variables GitHub requis :
#   PORTAINER_URL          ex: https://portainer.sty.ovh
#   PORTAINER_ENDPOINT_ID  ex: 1
#   HARBOR_REGISTRY        ex: registry.sty.ovh
#   HARBOR_USERNAME        ex: robot$gh-monapp
#
# Secrets GitHub requis :
#   PORTAINER_TOKEN        clé API Portainer (Settings → API Key dans Portainer)
#   HARBOR_PASSWORD        mot de passe robot Harbor
#   APP_MONGODB_ROOT_USERNAME
#   APP_MONGODB_ROOT_PASSWORD
#   APP_MONGODB_URI
#   APP_JWT_SECRET
#   APP_MINIO_ACCESS_KEY
#   APP_MINIO_SECRET_KEY

on:
  workflow_dispatch:

env:
  PORTAINER_URL: ${{ vars.PORTAINER_URL }}
  ENDPOINT_ID:   ${{ vars.PORTAINER_ENDPOINT_ID }}
  TOKEN:         ${{ secrets.PORTAINER_TOKEN }}
  NAMESPACE:     APP_NAME   # ← remplacer par le namespace du projet

jobs:
  app-secrets:
    name: Create/update APP_NAME-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Push APP_NAME-secrets (Opaque)
        env:
          MONGODB_ROOT_USERNAME: ${{ secrets.APP_MONGODB_ROOT_USERNAME }}
          MONGODB_ROOT_PASSWORD: ${{ secrets.APP_MONGODB_ROOT_PASSWORD }}
          MONGODB_URI:           ${{ secrets.APP_MONGODB_URI }}
          JWT_SECRET:            ${{ secrets.APP_JWT_SECRET }}
          MINIO_ACCESS_KEY:      ${{ secrets.APP_MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY:      ${{ secrets.APP_MINIO_SECRET_KEY }}
        run: |
          BASE="$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/kubernetes/api/v1/namespaces/$NAMESPACE/secrets"

          PAYLOAD=$(jq -cn \
            --arg u   "$MONGODB_ROOT_USERNAME" \
            --arg p   "$MONGODB_ROOT_PASSWORD" \
            --arg uri "$MONGODB_URI"           \
            --arg jwt "$JWT_SECRET"            \
            --arg mak "$MINIO_ACCESS_KEY"      \
            --arg msk "$MINIO_SECRET_KEY"      \
            '{
              "apiVersion": "v1",
              "kind": "Secret",
              "metadata": { "name": "APP_NAME-secrets", "namespace": env.NAMESPACE },
              "type": "Opaque",
              "stringData": {
                "mongodb_root_username": $u,
                "mongodb_root_password": $p,
                "mongodb_uri":           $uri,
                "jwt_secret":            $jwt,
                "minio_access_key":      $mak,
                "minio_secret_key":      $msk
              }
            }')

          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PUT "$BASE/APP_NAME-secrets" \
            -H "X-API-Key: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "PUT status: $STATUS"

          if [ "$STATUS" = "404" ] || [ "$STATUS" = "405" ]; then
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "$BASE" \
              -H "X-API-Key: $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "POST status: $STATUS"
          fi

          [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ] && { cat /tmp/resp.json; exit 1; }
          echo "✅ APP_NAME-secrets configuré"

  harbor-credentials:
    name: Create/update harbor-credentials
    runs-on: ubuntu-latest
    steps:
      - name: Push harbor-credentials (docker-registry)
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USER:     ${{ vars.HARBOR_USERNAME }}
          HARBOR_PASS:     ${{ secrets.HARBOR_PASSWORD }}
        run: |
          BASE="$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/kubernetes/api/v1/namespaces/$NAMESPACE/secrets"

          AUTH_B64=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w 0)
          DOCKER_CFG=$(jq -cn \
            --arg reg  "$HARBOR_REGISTRY" \
            --arg user "$HARBOR_USER"     \
            --arg pass "$HARBOR_PASS"     \
            --arg auth "$AUTH_B64"        \
            '{"auths":{($reg):{"username":$user,"password":$pass,"auth":$auth}}}')
          CFG_B64=$(printf '%s' "$DOCKER_CFG" | base64 -w 0)

          PAYLOAD=$(jq -cn \
            --arg cfg "$CFG_B64" \
            '{
              "apiVersion": "v1",
              "kind": "Secret",
              "metadata": { "name": "harbor-credentials", "namespace": env.NAMESPACE },
              "type": "kubernetes.io/dockerconfigjson",
              "data": { ".dockerconfigjson": $cfg }
            }')

          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PUT "$BASE/harbor-credentials" \
            -H "X-API-Key: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "PUT status: $STATUS"

          if [ "$STATUS" = "404" ] || [ "$STATUS" = "405" ]; then
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "$BASE" \
              -H "X-API-Key: $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "POST status: $STATUS"
          fi

          [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ] && { cat /tmp/resp.json; exit 1; }
          echo "✅ harbor-credentials configuré"
