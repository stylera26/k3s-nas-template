name: Docker Build & Push (Reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name sans prefix registry (ex: my-api)"
        required: true
        type: string
      registry:
        description: "Harbor registry hostname"
        type: string
        default: 'registry.sty.ovh'
      project:
        description: "Projet Harbor (ex: stylera)"
        required: true
        type: string
      context:
        description: "Docker build context"
        type: string
        default: '.'
      registry-username:
        description: "Harbor username"
        required: true
        type: string
    secrets:
      registry-password:
        required: true
    outputs:
      image-tag:
        description: "Tag SHA court de l'image poussée"
        value: ${{ jobs.docker.outputs.image-tag }}
      image-ref:
        description: "Référence complète de l'image"
        value: ${{ jobs.docker.outputs.image-ref }}

jobs:
  docker:
    name: Build & push Harbor
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-ref: ${{ inputs.registry }}/${{ inputs.project }}/${{ inputs.image-name }}:${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.project }}/${{ inputs.image-name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-password }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
